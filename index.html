<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pdfpng</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>
<style>
  :root{
    --paper: #F7F5F0;
    --paper-2: #EFEBE2;
    --ink: #22221F;
    --ink-soft: #5B5A52;
    --line: #D8D3C6;
    --stamp: #A83C2E;
    --stamp-ink: #7C2C21;
    --ok: #3E6B4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 40px 20px 60px;
  }
  .sheet{ width:100%; max-width:560px; }
  h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size:26px;
    line-height:1.2;
    margin:0 0 24px;
    letter-spacing:-0.01em;
  }

  .drop{
    position:relative;
    border:1.5px dashed var(--line);
    border-radius:2px;
    background:var(--paper-2);
    padding:34px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop.drag{ border-color:var(--stamp); background:#F3E7E1; }
  .drop:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }
  .drop-icon{ width:34px; height:44px; margin:0 auto 12px; position:relative; }
  .drop-icon .page{
    position:absolute; width:34px; height:44px;
    border:1.5px solid var(--ink-soft);
    background:var(--paper); border-radius:1px;
  }
  .drop-icon .page:first-child{ transform: translate(-4px,-4px); opacity:.55; }
  .drop-icon .page:last-child{ transform: translate(4px,4px); }
  .drop-title{ font-size:13px; margin-bottom:4px; }
  .drop-sub{ font-size:11px; color:var(--ink-soft); }

  .dpi-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:10px; font-size:11px; color:var(--ink-soft);
  }
  .dpi-row:first-of-type{ margin-top:18px; }
  .row-label{
    display:inline-block; width:60px; flex-shrink:0;
  }
  select{
    font-family:inherit; font-size:11px;
    background:var(--paper-2); border:1px solid var(--line);
    color:var(--ink); padding:6px 8px; border-radius:2px;
  }
  .custom-input{ width:130px; }

  @media (max-width: 480px){
    .dpi-row{
      flex-direction:column; align-items:stretch; gap:4px;
    }
    .row-label{ width:auto; }
    .dpi-row select,
    .dpi-row .custom-input{ width:100%; }
  }

  .queue{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .item{
    border:1px solid var(--line);
    background:var(--paper-2);
    border-radius:2px;
    padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    font-size:12px;
  }
  .item-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-status{ color:var(--ink-soft); font-size:11px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .item-status.error{ color:var(--stamp-ink); }
  .item-dpi-tag{ color:var(--ok); font-size:10px; }
  .item-thumb{
    width:28px; height:36px; object-fit:cover;
    border:1px solid var(--line); background:#fff; flex-shrink:0;
  }
  .btn{
    font-family:inherit; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:8px 14px; border-radius:2px; cursor:pointer;
    text-decoration:none; white-space:nowrap; display:inline-block;
  }
  .btn:hover{ background:var(--stamp); border-color:var(--stamp); }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.small{ font-size:10px; padding:4px 8px; }

  .queue-progress{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-soft);
  }
  .queue-progress.done{ color:var(--ok); }
  .spinner{
    width:11px; height:11px; flex-shrink:0;
    border:2px solid var(--line);
    border-top-color:var(--stamp);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .summary{
    margin-top:16px; padding:12px 14px;
    border:1px solid var(--line); background:var(--paper-2); border-radius:2px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:11px; color:var(--ink-soft); flex-wrap:wrap;
  }

  footer{
    margin-top:32px; padding-top:16px;
    border-top:1px solid var(--line);
    font-size:10px; color:var(--ink-soft);
    text-align:center; line-height:1.5;
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Satukan PDF, hilangkan<br>spasi kosong.</h1>

    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Pilih atau taruh file PDF atau ZIP">
      <input type="file" id="fileInput" accept=".pdf,.zip,application/pdf,application/zip,application/x-zip-compressed" multiple style="display:none">
      <div class="drop-icon"><span class="page"></span><span class="page"></span></div>
      <div class="drop-title">Taruh file PDF/ZIP di sini, atau klik untuk pilih</div>
      <div class="drop-sub">Bisa banyak file sekaligus · ZIP berisi banyak PDF juga bisa</div>
    </div>

    <div class="dpi-row">
      <span class="row-label">Resolusi:</span>
      <select id="dpiSelect">
        <option value="px2800" selected>2800 px — rekomendasi PDF 2 halaman</option>
        <option value="px2000">2000 px — rekomendasi PDF 3 halaman</option>
        <option value="custom-px">Input manual (pixel)</option>
        <option value="300">300 DPI</option>
        <option value="450">450 DPI</option>
        <option value="600">600 DPI</option>
        <option value="custom-dpi">Input manual (DPI)</option>
      </select>
      <input type="number" id="customPxInput" class="custom-input" placeholder="Lebar px, mis. 2480"
        min="500" max="12000" style="display:none;">
      <input type="number" id="customDpiInput" class="custom-input" placeholder="DPI, mis. 300"
        min="72" max="1450" style="display:none;">
    </div>

    <div class="dpi-row">
      <span class="row-label">Mode:</span>
      <select id="ratioSelect">
        <option value="a4" selected>A4 (Rasio akhir akan jadi A4 1 halaman)</option>
        <option value="a4-nofoto">A4 tanpa foto (potong foto otomatis)</option>
        <option value="bebas">Bebas (Rasio sesuai file yang diupload)</option>
      </select>
    </div>

    <div class="dpi-row">
      <button class="btn" id="clearBtn" type="button" style="padding:6px 10px;">Bersihkan</button>
      <span id="queueProgress" class="queue-progress" style="display:none;"></span>
    </div>

    <div class="queue" id="queue"></div>
    <div class="summary" id="summary" style="display:none;"></div>

    <footer>
      pdfpng · adalah alat yang tidak penting . untuk mengerjakan sesuatu yang juga tidak penting . 
    </footer>
  </div>

<script>
if (typeof pdfjsLib === 'undefined') {
  document.getElementById('drop').outerHTML =
    '<div class="drop" style="cursor:default;border-color:var(--stamp);background:#F3E7E1;">' +
    '<div class="drop-title" style="color:var(--stamp-ink)">Gagal memuat komponen PDF dari CDN.</div>' +
    '<div class="drop-sub">Coba refresh halaman, atau periksa koneksi internet.</div></div>';
  throw new Error('pdfjsLib gagal dimuat dari CDN');
}
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const BG = "#ffffff";
function getA4Size(dpi){
  return {
    w: Math.round(210 * dpi / 25.4),
    h: Math.round(297 * dpi / 25.4)
  };
}

// Format ukuran file jadi B/KB/MB/GB yang mudah dibaca.
function formatBytes(bytes){
  if (!bytes || bytes < 1024) return (bytes || 0) + ' B';
  const units = ['KB', 'MB', 'GB'];
  let val = bytes / 1024, i = 0;
  while (val >= 1024 && i < units.length - 1){ val /= 1024; i++; }
  return (val < 10 ? val.toFixed(1) : Math.round(val)) + ' ' + units[i];
}

const summaryEl = document.getElementById('summary');

const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const queueEl = document.getElementById('queue');
const dpiSelect = document.getElementById('dpiSelect');
const customPxInput = document.getElementById('customPxInput');
const customDpiInput = document.getElementById('customDpiInput');
const ratioSelect = document.getElementById('ratioSelect');
const clearBtn = document.getElementById('clearBtn');

// Ambil DPI yang sedang berlaku dari pilihan dropdown resolusi.
// "px2800"/"px2000": preset pixel tetap (hasil eksperimen langsung di PPT).
// "custom-px": pixel bebas dari pengguna.
// "300"/"450"/"600": preset DPI biasa.
// "custom-dpi": DPI bebas dari pengguna.
// Pixel & DPI itu cuma dua cara menyebut angka yang sama untuk kertas
// berukuran tetap (sisi 210mm): dpi = pixel × 25.4 / 210.
function pxToDpi(px){ return px * 25.4 / 210; }

function getSelectedDpi(){
  const val = dpiSelect.value;
  if (val === 'px2800') return pxToDpi(2800);
  if (val === 'px2000') return pxToDpi(2000);
  if (val === 'custom-px'){
    let px = parseInt(customPxInput.value, 10);
    if (!px || px < 300) px = 300;
    if (px > 12000) px = 12000; // batas wajar, mencegah kanvas kebesaran tanpa sengaja
    return pxToDpi(px);
  }
  if (val === 'custom-dpi'){
    let dpi = parseInt(customDpiInput.value, 10);
    if (!dpi || dpi < 72) dpi = 72;
    if (dpi > 1450) dpi = 1450; // setara batas 12000px di atas, biar konsisten
    return dpi;
  }
  return parseInt(val, 10); // '300', '450', '600'
}

function updateCustomInputsVisibility(){
  customPxInput.style.display = dpiSelect.value === 'custom-px' ? 'inline-block' : 'none';
  customDpiInput.style.display = dpiSelect.value === 'custom-dpi' ? 'inline-block' : 'none';
  if (dpiSelect.value === 'custom-px' && !customPxInput.value) customPxInput.value = 2480;
  if (dpiSelect.value === 'custom-dpi' && !customDpiInput.value) customDpiInput.value = 300;
}

dpiSelect.addEventListener('change', () => {
  updateCustomInputsVisibility();
  const dpi = getSelectedDpi();
  filesQueue.forEach(entry => enqueueProcessing(entry, dpi));
});
customPxInput.addEventListener('change', () => {
  const dpi = getSelectedDpi();
  filesQueue.forEach(entry => enqueueProcessing(entry, dpi));
});
customDpiInput.addEventListener('change', () => {
  const dpi = getSelectedDpi();
  filesQueue.forEach(entry => enqueueProcessing(entry, dpi));
});

// Batas aman ukuran kanvas lintas-browser. Kalau halaman PDF (dikali DPI
// yang diminta) bakal melebihi ini, DPI efektif diturunkan otomatis supaya
// tidak menabrak error "Canvas is already in error state" dari browser.
// Ini HANYA diterapkan di mode Bebas — mode A4 selalu aman karena hasilnya
// dipatok ke ukuran A4 standar (maksimal 4961x7016 di 600 DPI).
const MAX_CANVAS_DIMENSION = 8000;
const MAX_CANVAS_AREA = 45_000_000;

// Menyimpan semua file yang sudah dimasukkan, supaya bisa diproses ulang
// otomatis kalau resolusi diganti belakangan.
const filesQueue = [];

// Antrean pemrosesan SEKUENSIAL: hanya 1 file dirender pada satu waktu.
// Penting untuk komputer yang tidak kuat — kalau banyak file (misal dari
// satu ZIP berisi puluhan PDF) dirender BERSAMAAN, memori & CPU bisa
// kehabisan sampai browser/komputer hang. Dengan antrean ini, file lain
// menunggu giliran sampai file sebelumnya selesai diproses.
const processingQueue = [];
let isProcessingQueue = false;

// Pelacak progres batch saat ini, ditampilkan di sebelah tombol Bersihkan.
// batchTotal bertambah tiap ada file baru masuk antrean SELAMA batch masih
// berjalan; batchDone bertambah tiap 1 file selesai (sukses/gagal).
const queueProgressEl = document.getElementById('queueProgress');
let batchTotal = 0;
let batchDone = 0;
let hideProgressTimeout = null;

function updateProgressUI(){
  clearTimeout(hideProgressTimeout);
  queueProgressEl.classList.remove('done');
  if (batchTotal === 0){
    queueProgressEl.style.display = 'none';
    queueProgressEl.innerHTML = '';
    return;
  }
  const percent = Math.round((batchDone / batchTotal) * 100);
  queueProgressEl.style.display = 'inline-flex';
  queueProgressEl.innerHTML = `<span class="spinner"></span> Memproses ${batchDone}/${batchTotal} (${percent}%)`;
}

function showQueueFinished(){
  queueProgressEl.style.display = 'inline-flex';
  queueProgressEl.classList.add('done');
  queueProgressEl.innerHTML = 'Selesai ✓';
  // Sembunyikan lagi setelah sejenak, kecuali ada batch baru yang masuk duluan.
  hideProgressTimeout = setTimeout(() => {
    if (!isProcessingQueue && processingQueue.length === 0){
      batchTotal = 0;
      batchDone = 0;
      queueProgressEl.style.display = 'none';
      queueProgressEl.innerHTML = '';
    }
  }, 1800);
}

function enqueueProcessing(entry, dpi){
  processingQueue.push({ entry, dpi });
  batchTotal++;
  updateProgressUI();
  if (entry.statusEl && !entry.blob){
    entry.statusEl.textContent = 'menunggu giliran…';
  }
  runProcessingQueue();
}

async function runProcessingQueue(){
  if (isProcessingQueue) return;
  isProcessingQueue = true;
  while (processingQueue.length > 0){
    const { entry, dpi } = processingQueue.shift();
    try {
      await processEntry(entry, dpi);
    } catch (err){
      console.error('Kesalahan tak terduga di antrean:', err);
    }
    batchDone++;
    updateProgressUI();
  }
  isProcessingQueue = false;
  showQueueFinished();
}

['dragenter','dragover'].forEach(ev =>
  dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('drag'); })
);
['dragleave','drop'].forEach(ev =>
  dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('drag'); })
);
dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
});
dropEl.addEventListener('drop', e => {
  const files = [...e.dataTransfer.files].filter(f =>
    f.type === 'application/pdf' ||
    f.type === 'application/zip' ||
    f.type === 'application/x-zip-compressed' ||
    /\.(pdf|zip)$/i.test(f.name)
  );
  handleFiles(files);
});
fileInput.addEventListener('change', e => {
  handleFiles([...e.target.files]);
  fileInput.value = '';
});

ratioSelect.addEventListener('change', () => {
  const dpi = getSelectedDpi();
  filesQueue.forEach(entry => enqueueProcessing(entry, dpi));
});

clearBtn.addEventListener('click', () => {
  // Bebaskan memori blob URL yang sudah dibuat, biar tidak bocor.
  filesQueue.forEach(entry => { if (entry.url) URL.revokeObjectURL(entry.url); });
  filesQueue.length = 0;
  queueEl.innerHTML = '';
  processingQueue.length = 0;
  batchTotal = 0;
  batchDone = 0;
  updateProgressUI();
  updateSummary();
});

// Perbarui kotak ringkasan di bawah daftar: tombol "Unduh Semua", total ukuran,
// dan "Ulangi Semua yang Gagal" kalau ada yang gagal. Dipanggil tiap kali ada
// file selesai diproses (sukses/gagal) atau saat Bersihkan.
function updateSummary(){
  const done = filesQueue.filter(e => e.blob);
  const failed = filesQueue.filter(e => e.failed);
  const showDownloadAll = filesQueue.length >= 2 && done.length > 0;
  const showRetryAll = failed.length > 0;

  if (!showDownloadAll && !showRetryAll){
    summaryEl.style.display = 'none';
    return;
  }

  const totalBytes = done.reduce((sum, e) => sum + (e.sizeBytes || 0), 0);
  summaryEl.style.display = 'flex';
  summaryEl.innerHTML = `
    <span>${done.length} dari ${filesQueue.length} file siap${done.length > 0 ? ' · Total: ' + formatBytes(totalBytes) : ''}</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap;">
      ${showRetryAll ? `<button class="btn" id="retryAllBtn" type="button">Ulangi Semua yang Gagal (${failed.length})</button>` : ''}
      ${showDownloadAll ? `<button class="btn" id="downloadAllPngBtn" type="button">Unduh Semua (PNG)</button>` : ''}
      ${showDownloadAll ? `<button class="btn" id="downloadAllBtn" type="button">Unduh Semua (ZIP)</button>` : ''}
    </span>
  `;
  if (showRetryAll){
    document.getElementById('retryAllBtn').addEventListener('click', () => {
      const dpi = getSelectedDpi();
      filesQueue.filter(e => e.failed).forEach(entry => enqueueProcessing(entry, dpi));
    });
  }
  if (showDownloadAll){
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAllAsZip);
    document.getElementById('downloadAllPngBtn').addEventListener('click', downloadAllAsPngs);
  }
}

// Unduh tiap PNG satu-satu (bukan dibungkus ZIP). Browser biasanya akan
// menampilkan izin/konfirmasi kalau banyak file diunduh sekaligus dari satu
// klik — itu wajar, pengamanan bawaan browser, bukan bug. Jeda kecil antar
// unduhan dipasang supaya tidak langsung ditolak.
function downloadAllAsPngs(){
  const done = filesQueue.filter(e => e.blob);
  if (done.length === 0) return;

  done.forEach((entry, i) => {
    setTimeout(() => {
      const outName = entry.file.name.replace(/\.pdf$/i, '') + '.png';
      const a = document.createElement('a');
      a.href = entry.url;
      a.download = outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 350);
  });
}

async function downloadAllAsZip(){
  if (typeof JSZip === 'undefined'){
    alert('Komponen ZIP gagal dimuat dari CDN. Coba refresh halaman atau periksa koneksi internet.');
    return;
  }
  const done = filesQueue.filter(e => e.blob);
  if (done.length === 0) return;

  const btn = document.getElementById('downloadAllBtn');
  btn.disabled = true;
  btn.textContent = 'Menyiapkan ZIP…';

  try {
    const zip = new JSZip();
    const usedNames = new Set();
    for (const entry of done){
      let name = entry.file.name.replace(/\.pdf$/i, '') + '.png';
      // Hindari nama bentrok kalau ada 2 file PDF dengan nama sama persis.
      let finalName = name, counter = 1;
      while (usedNames.has(finalName)){
        finalName = name.replace(/\.png$/i, `_${++counter}.png`);
      }
      usedNames.add(finalName);
      zip.file(finalName, entry.blob);
    }
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pdfpng_hasil.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (err){
    console.error(err);
    alert('Gagal membuat ZIP: ' + (err.message || 'coba lagi'));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unduh Semua (ZIP)';
  }
}

// Tambah satu file PDF ke antrean & langsung proses. Dipakai baik untuk
// PDF yang di-drop langsung, maupun PDF hasil ekstrak dari dalam ZIP.
function addFileEntry(file, dpi){
  const row = document.createElement('div');
  row.className = 'item';
  row.innerHTML = `
    <img class="item-thumb" style="visibility:hidden">
    <span class="item-name">${escapeHtml(file.name)}</span>
    <span class="item-status">menunggu giliran…</span>
  `;
  queueEl.prepend(row);
  const entry = {
    file,
    statusEl: row.querySelector('.item-status'),
    thumbEl: row.querySelector('.item-thumb'),
    url: null
  };
  filesQueue.push(entry);
  enqueueProcessing(entry, dpi);
  return entry;
}

// Buka file ZIP, cari semua PDF di dalamnya (termasuk yang ada di subfolder),
// lalu masukkan tiap PDF ke antrean seperti biasa.
async function handleZipFile(zipFile){
  const row = document.createElement('div');
  row.className = 'item';
  row.innerHTML = `
    <span class="item-name">${escapeHtml(zipFile.name)}</span>
    <span class="item-status">membuka ZIP…</span>
  `;
  queueEl.prepend(row);
  const statusEl = row.querySelector('.item-status');

  try {
    if (typeof JSZip === 'undefined'){
      throw new Error('komponen ZIP gagal dimuat dari CDN');
    }
    const buf = await zipFile.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const pdfEntries = Object.values(zip.files).filter(
      f => !f.dir && /\.pdf$/i.test(f.name)
    );

    if (pdfEntries.length === 0){
      statusEl.textContent = 'tidak ada file PDF di dalam ZIP ini';
      statusEl.classList.add('error');
      return;
    }

    const dpi = getSelectedDpi();
    for (const zEntry of pdfEntries){
      const pdfBuf = await zEntry.async('arraybuffer');
      const baseName = zEntry.name.split('/').pop(); // buang path folder di dalam zip
      // PENTING: kembalikan SALINAN baru (.slice(0)) tiap kali arrayBuffer()
      // dipanggil. pdf.js men-transfer kepemilikan buffer ke web worker saat
      // dipakai, jadi kalau pdfBuf yang sama dipakai lagi (misal saat resolusi
      // diganti & diproses ulang), akan gagal dengan error "detached ArrayBuffer".
      const pseudoFile = { name: baseName, arrayBuffer: async () => pdfBuf.slice(0) };
      addFileEntry(pseudoFile, dpi);
    }
    row.remove(); // baris "membuka ZIP" tidak perlu lagi, sudah digantikan baris per-PDF
  } catch (err){
    console.error(err);
    statusEl.textContent = 'gagal membuka ZIP: ' + (err.message || '');
    statusEl.classList.add('error');
  }
}

function handleFiles(files){
  const dpi = getSelectedDpi();
  files.forEach(file => {
    const isZip = /\.zip$/i.test(file.name)
      || file.type === 'application/zip'
      || file.type === 'application/x-zip-compressed';
    if (isZip){
      handleZipFile(file);
    } else {
      addFileEntry(file, dpi);
    }
  });
}

async function processEntry(entry, dpi){
  entry.statusEl.classList.remove('error');
  entry.statusEl.textContent = 'memproses…';

  try {
    const buf = await entry.file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const ratioMode = ratioSelect.value; // 'a4' atau 'bebas'

    let effectiveDpi = dpi;
    let dpiNote = '';

    if (ratioMode === 'bebas'){
      // Cek dulu ukuran halaman (dalam pt) sebelum render, supaya bisa
      // menurunkan DPI otomatis kalau halamannya jauh lebih besar dari A4
      // (misal gambar teknis/denah ukuran A2/A1) — mencegah crash kanvas.
      const pageSizes = [];
      for (let i = 1; i <= pdf.numPages; i++){
        const page = await pdf.getPage(i);
        pageSizes.push({ w: page.view[2] - page.view[0], h: page.view[3] - page.view[1] });
      }
      effectiveDpi = computeSafeDpi(pageSizes, dpi);
      if (Math.round(effectiveDpi) < dpi){
        dpiNote = ` (diturunkan dari ${dpi}, halaman besar)`;
      }
    }

    const { w: A4_W, h: A4_H } = getA4Size(effectiveDpi);

    const pageCanvases = [];
    let lampiranFound = false; // sekali ketemu, semua halaman SESUDAHNYA dibuang total
    for (let i = 1; i <= pdf.numPages; i++){
      if (lampiranFound) break; // halaman lampiran (foto dsb) bisa lebih dari 1 halaman

      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: effectiveDpi / 72 });
      let canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      if (ratioMode === 'a4-nofoto'){
        const cutY = await findLampiranCutY(page, viewport);
        if (cutY !== null){
          const margin = Math.round(effectiveDpi * 0.08); // sedikit ruang di atas label
          const keepHeight = Math.max(1, Math.round(cutY - margin));
          if (keepHeight < canvas.height){
            const cropped = document.createElement('canvas');
            cropped.width = canvas.width;
            cropped.height = keepHeight;
            cropped.getContext('2d').drawImage(canvas, 0, 0, canvas.width, keepHeight, 0, 0, canvas.width, keepHeight);
            canvas = cropped;
          }
          // Tandai: halaman ini adalah tempat "Lampiran" muncul. Halaman-halaman
          // setelah ini (misal foto yang menyambung ke halaman berikutnya)
          // tidak ikut dirender sama sekali, bukan cuma dipotong sebagian.
          lampiranFound = true;
        }
      }
      pageCanvases.push(canvas);
    }

    const trimmed = trimPages(pageCanvases, effectiveDpi);
    const natural = stitchNatural(trimmed);
    const finalCanvas = (ratioMode === 'a4' || ratioMode === 'a4-nofoto')
      ? fitToPrintA4(natural, A4_W, A4_H)
      : natural;

    const blob = await new Promise(res => finalCanvas.toBlob(res, 'image/png'));

    if (entry.url) URL.revokeObjectURL(entry.url);
    entry.url = URL.createObjectURL(blob);
    entry.blob = blob;
    entry.sizeBytes = blob.size;
    entry.failed = false;

    entry.thumbEl.src = entry.url;
    entry.thumbEl.style.visibility = 'visible';

    const outName = entry.file.name.replace(/\.pdf$/i, '') + '.png';
    const dpiLabel = Math.round(effectiveDpi) + ' DPI' + dpiNote;
    entry.statusEl.innerHTML = `
      <a class="btn" href="${entry.url}" download="${escapeAttr(outName)}">Unduh PNG</a>
      <span class="item-dpi-tag">${dpiLabel} · ${finalCanvas.width}×${finalCanvas.height}px · ${formatBytes(blob.size)}</span>
    `;
    updateSummary();
  } catch (err){
    console.error(err);
    entry.blob = null;
    entry.sizeBytes = 0;
    entry.failed = true;
    entry.statusEl.innerHTML = '';
    entry.statusEl.textContent = 'gagal: ' + (err.message || 'periksa file') + ' ';
    entry.statusEl.classList.add('error');
    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn small';
    retryBtn.type = 'button';
    retryBtn.textContent = 'Ulangi';
    retryBtn.addEventListener('click', () => enqueueProcessing(entry, getSelectedDpi()));
    entry.statusEl.appendChild(retryBtn);
    updateSummary();
  }
}

// Cari posisi Y kata "Lampiran" pada suatu halaman (dipakai mode "A4 tanpa foto").
// Kalau ketemu, semua yang ada di bawah kata itu (biasanya foto lampiran)
// akan dipotong sebelum digabung. Kalau tidak ada kata "Lampiran" di
// halaman itu, dibiarkan utuh seperti biasa.
async function findLampiranCutY(page, viewport){
  const textContent = await page.getTextContent();
  const item = textContent.items.find(it => it.str && it.str.trim().toLowerCase() === 'lampiran');
  if (!item) return null;
  const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
  return tx[5]; // posisi y (pixel canvas) dari teks tersebut
}

// Hitung DPI efektif yang aman untuk seluruh halaman dalam satu file,
// supaya tidak menabrak batas ukuran kanvas maksimum browser.
// pageSizes: array {w, h} dalam satuan pt (1/72 inci) per halaman.
function computeSafeDpi(pageSizes, requestedDpi){
  let minScale = 1;
  for (const { w, h } of pageSizes){
    const pxW = w * requestedDpi / 72;
    const pxH = h * requestedDpi / 72;
    let scale = 1;
    if (pxW > MAX_CANVAS_DIMENSION) scale = Math.min(scale, MAX_CANVAS_DIMENSION / pxW);
    if (pxH > MAX_CANVAS_DIMENSION) scale = Math.min(scale, MAX_CANVAS_DIMENSION / pxH);
    const area = pxW * pxH * scale * scale;
    if (area > MAX_CANVAS_AREA) scale = Math.min(scale, scale * Math.sqrt(MAX_CANVAS_AREA / area));
    minScale = Math.min(minScale, scale);
  }
  return requestedDpi * minScale;
}

// --- Deteksi & pemotongan spasi kosong ---

const WHITE_THRESHOLD = 248;
function minContentPixels(width){ return Math.max(3, Math.round(width * 0.002)); }

function findContentRows(canvas){
  const ctx = canvas.getContext('2d');
  const { width, height } = canvas;
  const data = ctx.getImageData(0, 0, width, height).data;
  const threshold = minContentPixels(width);
  const rowHasContent = new Array(height).fill(false);

  for (let y = 0; y < height; y++){
    let count = 0;
    const rowOffset = y * width * 4;
    for (let x = 0; x < width; x++){
      const i = rowOffset + x * 4;
      if (data[i] < WHITE_THRESHOLD || data[i+1] < WHITE_THRESHOLD || data[i+2] < WHITE_THRESHOLD){
        count++;
        if (count >= threshold) { rowHasContent[y] = true; break; }
      }
    }
  }

  let top = height, bottom = -1;
  for (let y = 0; y < height; y++){
    if (rowHasContent[y]){ if (y < top) top = y; if (y > bottom) bottom = y; }
  }
  if (bottom === -1) return { top: 0, bottom: height - 1 };

  return { top, bottom };
}

function trimPages(pages, dpi){
  const n = pages.length;
  const outerMargin = Math.round(dpi * 0.12);
  const innerMargin = Math.round(dpi * 0.03);

  return pages.map((canvas, idx) => {
    const { top: contentTop, bottom: contentBottom } = findContentRows(canvas);
    const isFirst = idx === 0;
    const isLast = idx === n - 1;

    const top = Math.max(0, contentTop - (isFirst ? outerMargin : innerMargin));
    const bottom = Math.min(canvas.height - 1, contentBottom + (isLast ? outerMargin : innerMargin));
    const cropH = Math.max(1, bottom - top + 1);

    const cropped = document.createElement('canvas');
    cropped.width = canvas.width;
    cropped.height = cropH;
    cropped.getContext('2d').drawImage(canvas, 0, top, canvas.width, cropH, 0, 0, canvas.width, cropH);
    return cropped;
  });
}

function stitchNatural(pages){
  const width = Math.max(...pages.map(p => p.width));
  const totalHeight = pages.reduce((sum, p) => sum + p.height, 0);

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = totalHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, width, totalHeight);

  let y = 0;
  for (const p of pages){
    const x = Math.round((width - p.width) / 2);
    ctx.drawImage(p, x, y);
    y += p.height;
  }
  return canvas;
}

function fitToPrintA4(canvas, A4_W, A4_H){
  if (canvas.width === A4_W && canvas.height === A4_H) return canvas;

  const out = document.createElement('canvas');
  out.width = A4_W;
  out.height = A4_H;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, A4_W, A4_H);

  const scale = Math.min(A4_W / canvas.width, A4_H / canvas.height);
  const w = Math.round(canvas.width * scale);
  const h = Math.round(canvas.height * scale);
  const x = Math.round((A4_W - w) / 2);
  const y = Math.round((A4_H - h) / 2);
  ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, x, y, w, h);
  return out;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
